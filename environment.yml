# Conda environment for the Futbolstats project.
#
# Crear:     conda env create -f environment.yml
# Activar:   conda activate futbolstats
# Actualizar: conda env update -f environment.yml --prune
# Borrar:    conda env remove -n futbolstats
#
# Opcional, registrar como kernel de Jupyter:
#   python -m ipykernel install --user --name futbolstats --display-name "Futbolstats"

name: futbolstats
channels:
  - conda-forge

dependencies:
  # core scientific stack
  - python=3.12
  - pandas>=2.2
  - pyarrow>=15
  - numpy>=1.26
  - scipy>=1.13

  # machine learning
  - scikit-learn>=1.4
  - xgboost>=2.0
  - lightgbm>=4.3
  - statsmodels>=0.14

  # web scraping + parsing (soccerdata trae selenium/seleniumbase via pip)
  - requests>=2.31
  - beautifulsoup4>=4.12
  - lxml>=5.0
  - html5lib

  # text utilities
  - unidecode>=1.3

  # notebooks + viz
  - jupyterlab
  - ipykernel
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.20

  # dev helpers
  - tqdm
  - pip

  # pip-only (no están en conda-forge o están desactualizados)
  - pip:
      - soccerdata>=1.9
      - statsbombpy>=1.14
